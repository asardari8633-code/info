[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%}

:root{--bg:#e6ede7;--ink:#16241b;--mute:#6b7a70;--panel:#fff;--line:#d5e0d7;--g2:#2f855a;--gold:#d4af5a;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0d1510;--ink:#e8f0ea;--mute:#9db0a3;--panel:#17221b;--line:#28382d}}
:root[data-theme="dark"]{--bg:#0d1510;--ink:#e8f0ea;--mute:#9db0a3;--panel:#17221b;--line:#28382d}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:'Vazirmatn',Tahoma,sans-serif;line-height:1.7}
.tb{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;display:flex;gap:8px;justify-content:center;flex-wrap:wrap;padding:10px;background:var(--bg);border-bottom:1px solid var(--line)}
button{font:inherit;border:0;border-radius:12px;padding:8px 16px;cursor:pointer;font-weight:600;background:var(--g2);color:#fff}
button.sec2{background:var(--panel);color:var(--ink);border:1px solid var(--line)}
button:active{transform:scale(.97)}
.wrap{max-width:960px;margin:0 auto;padding:18px 12px 50px}

#sheet{overflow:hidden;min-width:0;background:radial-gradient(circle at 20% 0%,rgba(212,175,90,.18),rgba(0,0,0,0) 40%),repeating-linear-gradient(45deg,rgba(255,255,255,.025) 0 14px,rgba(255,255,255,0) 14px 28px),linear-gradient(160deg,#16222d,#0c141b 55%,#060a0f);color:#fff;border-radius:30px;padding:26px 18px 20px;border:1px solid #243543;box-shadow:0 24px 60px rgba(3,8,12,.5)}
.hero{padding:6px 10px;text-align:center;color:#fff}
#logo{width:96px;height:96px;margin:0 auto 12px;border-radius:50%;background:#fff;display:grid;place-items:center;overflow:hidden;border:4px solid var(--gold);box-shadow:0 0 0 6px rgba(255,255,255,.12),0 10px 24px rgba(0,0,0,.25);cursor:pointer}
#logo img{width:100%;height:100%;object-fit:cover}#logo span{font-size:42px}
.hero h1{margin:0;font-size:clamp(19px,4.8vw,29px);font-weight:800;text-shadow:0 2px 8px rgba(0,0,0,.3)}
.sub{display:flex;align-items:center;justify-content:center;gap:12px;margin-top:8px;color:#f0d98f;font-size:13.5px}
.sub:before,.sub:after{content:"";height:1px;width:clamp(24px,10vw,70px);background:linear-gradient(90deg,rgba(240,217,143,0),#f0d98f)}
.sub:after{transform:scaleX(-1)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(330px,100%),1fr));gap:30px 26px;margin-top:22px;padding:0 4px}

.acc{display:flex;flex-direction:column;gap:6px}
.card{position:relative;overflow:hidden;border-radius:24px;padding:20px 20px 18px;color:#fff;display:flex;flex-direction:column;gap:13px;
background:linear-gradient(135deg,var(--c),var(--d));box-shadow:0 16px 30px rgba(0,0,0,.18),inset 0 0 0 1px rgba(255,255,255,.2)}
.card:before{content:"";position:absolute;width:260px;height:260px;border-radius:50%;left:-90px;top:-120px;background:rgba(255,255,255,.1)}
.card:after{content:"";position:absolute;inset:0;background:repeating-linear-gradient(135deg,rgba(255,255,255,.04) 0 2px,rgba(255,255,255,0) 2px 14px);pointer-events:none}
.card>*{position:relative;z-index:1}
.ct{display:flex;align-items:center;justify-content:space-between}
.bw{display:flex;align-items:center;gap:11px}
.badge{width:46px;height:46px;border-radius:14px;background:#fff;color:var(--c);display:grid;place-items:center;font-weight:800;font-size:15px;overflow:hidden;box-shadow:0 4px 10px rgba(0,0,0,.2)}
.badge img{width:100%;height:100%;object-fit:contain}
.bn{font-weight:800;font-size:17px}
.chip{width:42px;height:31px;border-radius:8px;background:linear-gradient(135deg,#f8e08e,#c9a24b);box-shadow:inset 0 0 0 1px rgba(0,0,0,.15)}
.rw{display:flex;justify-content:space-between;align-items:center;font-size:12px;opacity:.9;margin-bottom:4px}
.bt{display:flex;gap:5px}
.ghost{background:rgba(255,255,255,.22);color:#fff;padding:0 10px;font-size:11px;border-radius:9px;font-weight:600}
.val{direction:ltr;text-align:center;background:rgba(0,0,0,.2);border:1px solid rgba(255,255,255,.22);border-radius:14px;padding:8px 10px;font-weight:600;font-variant-numeric:tabular-nums;word-spacing:5px;color:#fbefc6;text-shadow:1px 1px 0 rgba(0,0,0,.35),-1px -1px 0 rgba(255,255,255,.2)}
.k-card{font-size:clamp(21px,6vw,26px);letter-spacing:2px}
.k-sheba{font-size:clamp(13.5px,3.9vw,16px);letter-spacing:1px}
.k-account{font-size:clamp(17px,4.8vw,21px);letter-spacing:1.5px}
.own{display:flex;justify-content:space-between;align-items:flex-end;gap:8px;border-top:1px dashed rgba(255,255,255,.35);padding-top:10px;font-size:12px}.own>div{display:flex;flex-direction:column}
.own b{font-size:14px;font-weight:700}
.act{display:flex;gap:4px;justify-content:center}
.act button{background:transparent;color:#6b7a70;padding:0 8px;font-size:12px;font-weight:400}
.foot{text-align:center;color:#a9b7c2;font-size:12.5px;margin:22px 0 6px}

.ov{position:fixed;inset:0;background:rgba(0,0,0,.5);display:none;align-items:center;justify-content:center;padding:14px;z-index:10}
.ov.on{display:flex}
.md{background:var(--panel);color:var(--ink);border-radius:20px;padding:20px;width:min(440px,100%);max-height:90vh;overflow:auto}
.md h3{margin:0 0 12px}
.md label{display:block;font-size:12.5px;color:var(--mute);margin:8px 0 3px}
input,select{font:inherit;width:100%;padding:9px 11px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--ink)}
input.l{direction:ltr;text-align:left}
.note{font-size:12px;color:var(--mute);margin-top:6px}
.md .r{display:flex;gap:8px;margin-top:14px}

.stage{position:relative;perspective:900px;padding:6px 0 28px}
.float{animation:fl 6s ease-in-out infinite;animation-delay:var(--dl)}
.tilt{transition:transform .18s ease-out;transform-style:preserve-3d}
.cimg{width:100%;height:auto;display:block;aspect-ratio:1280/807;border-radius:5%/8%;background:rgba(255,255,255,.08);color:transparent;font-size:0}
.stage:after{content:"";position:absolute;left:12%;right:12%;bottom:8px;height:18px;border-radius:50%;background:radial-gradient(ellipse at center,rgba(0,0,0,.55),rgba(0,0,0,0) 70%);animation:sh 6s ease-in-out infinite;animation-delay:var(--dl)}
@keyframes fl{0%,100%{transform:translateY(0) rotate(-.7deg)}50%{transform:translateY(-14px) rotate(.7deg)}}
@keyframes sh{0%,100%{transform:scaleX(1);opacity:1}50%{transform:scaleX(.82);opacity:.6}}
